
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Demonstration</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Just+Another+Hand&family=Katibeh&display=swap" rel="stylesheet">
</head>

<body>

    <!-- The header makes the page title stand out -->
    <div class="header">
        <h1>Video Demonstration</h1>
    </div>

    <p class="instruction" id="instruction">
        Click the play button to watch demo!
    </p>

    <div class="video-container">
        <img src="https://i.postimg.cc/D026j9Bp/dance.webp"
             alt="Zumba dancers demonstrating a routine">

        <a href="Picture Page.html" class="play-button"></a>
    </div>

    <a href="Rules page.html" class="rules-button">
        <span>Rules</span>
    </a>

    <p class="bottom-text">
        Click "Rules" to review rules!
    </p>

    <!-- This button gives the user a small interactive message -->
    <button onclick="changeMessage()">Click me!</button>

    <script>
        // Shows a greeting when the page loads
        console.log("Welcome to the Video Demonstration page!");

        // Changes the instruction text when the user clicks the button
        function changeMessage() {
            document.getElementById("instruction").innerHTML =
                "Let's get moving! Have fun!";
        }
    </script>

</body>
</html>

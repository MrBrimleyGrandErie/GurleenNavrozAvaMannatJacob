
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            width: 1440px;
            height: 1024px;
            max-width: 100%;
            background-color: #FFD5E2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .picture {
            width: 1330px;
            height: 888px;
            max-width: 100%;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 1440px) {
            body {
                width: 100%;
                min-height: 100vh;
                height: auto;
            }

            .picture {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <img
        class="picture"
        src="https://i.postimg.cc/D026j9Bp/dance.webp"
        alt="Zumba dancers"
    >

</body>
</html>
